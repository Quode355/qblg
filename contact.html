---
layout: page
title: Contact Me
description: 有什么想说的，欢迎留言。
background: '/img/bg-contact.jpg'
form: true
---

<p>欢迎留下你的想法、问题或建议，我会尽量回复你。</p>

<form
  action="https://api.web3forms.com/submit"
  method="POST"
  name="sentMessage"
  id="contactForm"
>
<!-- novalidate -->

  <!-- Web3Forms -->
  <input type="hidden" name="access_key" value="426c710f-04d8-47ce-b3cd-a1efa2dff5fb">

  <!-- 邮件标题 -->
  <input type="hidden" name="subject" value="qblg 网站新留言">

  <!-- 防垃圾提交 -->
  <input type="checkbox" name="botcheck" style="display: none;">

  <!-- Name -->
  <div class="control-group">
    <div class="form-group floating-label-form-group controls">
      <label>Name</label>
      <input
        type="text"
        class="form-control"
        placeholder="Name"
        id="name"
        name="name"
        required
        data-validation-required-message="Please enter your name."
      >
      <p class="help-block text-danger"></p>
    </div>
  </div>

  <!-- Email -->
  <div class="control-group">
    <div class="form-group floating-label-form-group controls">
      <label>Email Address</label>
      <input
        type="email"
        class="form-control"
        placeholder="Email Address"
        id="email"
        name="email"
        required
        data-validation-required-message="Please enter your email address."
      >
      <p class="help-block text-danger"></p>
    </div>
  </div>

  <!-- Message -->
  <div class="control-group">
    <div class="form-group floating-label-form-group controls">
      <label>Message</label>
      <textarea
        rows="5"
        class="form-control"
        placeholder="Message"
        id="message"
        name="message"
        required
        data-validation-required-message="Please enter a message."
      ></textarea>
      <p class="help-block text-danger"></p>
    </div>
  </div>

  <br>

  <div id="success"></div>

  <div class="form-group">
    <button
      type="submit"
      class="btn btn-primary"
      id="sendMessageButton"
    >
      Send
    </button>
  </div>

</form>
