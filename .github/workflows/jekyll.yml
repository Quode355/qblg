name: Build Jekyll site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/configure-pages@v5

    - uses: actions/jekyll-build-pages@v1
      with:
        source: ./

    - uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site


  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
    - uses: actions/deploy-pages@v4